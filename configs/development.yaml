seed: 42
data:
  input_path: data/input.txt
  train_path: artifacts/train_tokens.pt
  val_path: artifacts/val_tokens.pt
  validation_fraction: 0.1
tokenizer:
  encoding_name: cl100k_base
model:
  context_length: 128
  d_model: 128
  n_heads: 4
  n_layers: 4
  dropout: 0.1
  tie_embeddings: true
training:
  batch_size: 4
  max_steps: 1000
  eval_interval: 100
  eval_batches: 10
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  weight_decay: 0.1
  output_dir: checkpoints
generation:
  max_new_tokens: 80
  temperature: 0.8
  top_k: 40
